[package]
name = "broadside-style"
version = "0.1.0"
edition = "2024"
description = "Broadside style guides: user-authored rule sets compiled into Harper linters"
license = "Apache-2.0"
publish = false

[dependencies]
harper-core = { path = "../harper-core" }
harper-thesaurus = { path = "../harper-thesaurus" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
